<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <div class="bot-info">
                <img id="botAvatar" src="https://cdn.pixabay.com/photo/2020/07/01/12/58/icon-5359553_1280.png" alt="Bot Avatar" class="avatar">
                <div>
                    <h1 id="botName">Cargando...</h1>
                    <span class="status-badge"><i class="fas fa-circle status-icon"></i> Online</span>
                </div>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <i class="fas fa-network-wired"></i>
                    <div class="stat-info">
                        <span class="stat-label">Ping</span>
                        <span class="stat-value" id="botPing">-- ms</span>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-server"></i>
                    <div class="stat-info">
                        <span class="stat-label">Servidores</span>
                        <span class="stat-value" id="botGuilds">--</span>
                    </div>
                </div>
                <!-- Action Buttons -->
                <div class="system-actions">
                    <button id="btnLogs" class="btn-sys primary" title="Ver Logs del Bot"><i class="fas fa-terminal"></i> Logs</button>
                    <button id="btnShutdown" class="btn-sys danger" title="Apagar Bot Definitivamente"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </header>

        <main id="streamsContainer">
            <div class="loading-state">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p>Buscando transmisiones activas...</p>
            </div>
        </main>
    </div>

    <!-- Template for Streams -->
    <template id="streamTemplate">
        <div class="stream-card">
            <div class="card-header">
                <h2><i class="fas fa-music"></i> <span class="guild-name">Server Name</span></h2>
                <div class="channel-badge"><i class="fas fa-volume-up"></i> <span class="channel-name">Voice Channel</span></div>
            </div>
            <div class="card-body">
                <div class="current-track">
                    <div class="track-icon">
                        <i class="fab fa-youtube"></i>
                    </div>
                    <div class="track-details">
                        <p class="now-playing-label">Reproduciendo ahora</p>
                        <div class="track-title-wrapper">
                            <h3 class="track-title">Song Title</h3>
                        </div>
                        <a href="#" class="track-url" target="_blank"><i class="fas fa-external-link-alt"></i> Abrir Link</a>
                    </div>
                    <div class="audio-quality">
                        <span class="quality-badge"><i class="fas fa-headphones"></i> Studio Quality</span>
                        <span class="bitrate-badge">192kbps / Buffered</span>
                    </div>
                </div>
                
                <div class="player-controls" data-guild="">
                    <button class="btn-control action-pause" title="Pausar / Reanudar"><i class="fas fa-pause"></i></button>
                    <button class="btn-control action-shuffle" title="Aleatorio (Shuffle)"><i class="fas fa-random"></i></button>
                    <button class="btn-control action-skip" title="Saltar Canción"><i class="fas fa-step-forward"></i></button>
                    <button class="btn-control action-stop" title="Detener Bot"><i class="fas fa-stop"></i></button>
                </div>

                <div class="search-section">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="add-song-input" placeholder="Buscar canción o pegar link (Youtube/Spotify)...">
                        <button class="btn-add-song" title="Agregar a la cola">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>

                <div class="queue-section">
                    <h4>Cola (<span class="queue-length">0</span> en espera)</h4>
                    <ul class="upcoming-tracks">
                        <!-- li tracks here -->
                    </ul>
                </div>
            </div>
        </div>
    </template>

    <!-- Logs Modal -->
    <div id="logsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-terminal"></i> Terminal / Logs</h2>
                <button id="btnCloseLogs" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="terminal-window" id="logsContainer">
                    <div class="log-line">Esperando logs...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-sys outline" onclick="fetchLogs()">Refrescar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
